<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__AGENT_NAME__ · Agent Galaxy</title>
<meta name="description" content="Interactive 3D galaxy of a Hermes agent's tools, skills, memory, projects and channels.">
<style>
  /* The plugin is written against the Hermes dashboard's Tailwind classes; these are the few it uses. */
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000004; color: #e6e6f0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  #root { padding: 12px 16px; }
  .flex { display: flex; } .flex-wrap { flex-wrap: wrap; } .flex-1 { flex: 1; } .items-center { align-items: center; }
  .gap-1 { gap: .25rem; } .gap-3 { gap: .75rem; }
  .space-y-1 > * + * { margin-top: .25rem; } .space-y-2 > * + * { margin-top: .5rem; }
  .text-xs { font-size: .75rem; } .text-sm { font-size: .875rem; }
  .font-semibold { font-weight: 600; } .font-normal { font-weight: 400; }
  .text-muted-foreground { color: #9aa0b4; } .text-destructive { color: #ff6b6b; }
  .cursor-pointer { cursor: pointer; } .rounded { border-radius: .25rem; }
  .border { border: 1px solid; } .border-border { border-color: rgba(255, 255, 255, .2); }
  .bg-transparent { background: transparent; color: inherit; } .px-1 { padding: 0 .25rem; } .py-0\.5 { padding-top: .125rem; padding-bottom: .125rem; }
  a { color: #7fdbff; }
</style>
</head>
<body>
<div id="root"><noscript>Agent Galaxy needs JavaScript and WebGL.</noscript></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
  integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
  integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script>
  // The two globals the Hermes dashboard gives a plugin, reduced to what index.js uses:
  // React and its hooks, and a fetchJSON that reads the exported graph.json.
  window.__HERMES_PLUGIN_SDK__ = {
    React: React,
    hooks: { useState: React.useState, useEffect: React.useEffect, useRef: React.useRef },
    components: {},
    fetchJSON: function () {
      return fetch("graph.json").then(function (r) {
        if (!r.ok) throw new Error("graph.json: HTTP " + r.status);
        return r.json();
      });
    },
  };
  window.__HERMES_PLUGINS__ = {
    register: function (name, Component) {
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Component));
    },
  };
</script>
<script src="index.js"></script>
</body>
</html>
